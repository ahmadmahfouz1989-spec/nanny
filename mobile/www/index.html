<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ouiKnow</title>
  <!-- Shown by the app when oui-know.com can't be reached (capacitor.config.ts
       errorPath). In the phone's language, and it reconnects by itself as
       soon as the connection is back. -->
  <style>
    :root { color-scheme: light dark; --bg: #fbf8f4; --ink: #2b241c; --muted: #8a7f73; --primary: #e8552d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1712; --ink: #f3ede6; --muted: #a89c8f; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink); font: 17px/1.5 -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 21px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    button { background: var(--primary); color: #fff; border: 0; border-radius: 999px; min-height: 48px; padding: 12px 28px; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">You're offline</h1>
    <p id="body">ouiKnow needs an internet connection. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    var SITE = "https://oui-know.com/";
    if ((navigator.language || "").toLowerCase().indexOf("ar") === 0) {
      document.documentElement.lang = "ar";
      document.documentElement.dir = "rtl";
      document.getElementById("title").textContent = "ما في إنترنت";
      document.getElementById("body").textContent = "ouiKnow بحاجة لاتصال بالإنترنت. تأكّد من الاتصال وجرّب مرّة تانية.";
      document.getElementById("retry").textContent = "جرّب مرّة تانية";
    }
    function retry() { location.href = SITE; }
    document.getElementById("retry").addEventListener("click", retry);
    // Back online: go straight back, without waiting for a tap.
    window.addEventListener("online", retry);
  </script>
</body>
</html>
