<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ouiKnow — offline</title>
    <style>
      :root { --bg: #fbf8f4; --ink: #241d15; --muted: #8b8175; --primary: #ee4f26; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1b1712; --ink: #f7f1e7; --muted: #a89b8b; --primary: #ff7a4d; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: var(--bg); color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 8px 0 0; }
      p { margin: 0; color: var(--muted); line-height: 1.5; }
      [dir="rtl"] { font-family: system-ui, "Geeza Pro", Tahoma, sans-serif; }
      button {
        margin-top: 12px; border: 0; border-radius: 999px; padding: 12px 24px;
        background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Check your connection and try again.</p>
      <h1 dir="rtl" lang="ar">أنت غير متصل بالإنترنت</h1>
      <p dir="rtl" lang="ar">تحقق من اتصالك وحاول مرة أخرى.</p>
      <button type="button" onclick="location.reload()">Try again · حاول مرة أخرى</button>
    </main>
  </body>
</html>
